openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
  description: >
    Schema First microservice API
servers:
  - url: /api
    description: API gateway
tags:
  - name: orders
    description: Customer order lifecycle and PayPal payment flow

paths:
  /orders:
    post:
      tags: [orders]
      summary: Create an order from the user's cart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [orders]
      summary: List the user's orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of the authenticated user's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    get:
      tags: [orders]
      summary: Get one of the user's orders by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The requested order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/status:
    patch:
      tags: [orders]
      summary: Update an order status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/cancel:
    patch:
      tags: [orders]
      summary: Cancel one of the user's orders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Cancelled order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/pay:
    post:
      tags: [orders]
      summary: Start a PayPal payment for an order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '201':
          description: Payment created; redirect the buyer to `approveUrl`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPayment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{id}/capture:
    post:
      tags: [orders]
      summary: Capture an approved PayPal payment for an order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '201':
          description: Order after capture (status `PAID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/payment/return:
    get:
      tags: [orders]
      summary: PayPal buyer-approval return URL (no auth)
      description: >
        PayPal redirects the buyer here after approval. Intentionally unauthenticated
        because there is no JWT in the redirect.
      parameters:
        - name: token
          in: query
          required: true
          description: PayPal order ID (`token` query parameter)
          schema:
            type: string
      responses:
        '200':
          description: Order after capture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'

  /orders/payment/cancel:
    get:
      tags: [orders]
      summary: PayPal buyer-cancel return URL (no auth)
      responses:
        '200':
          description: Human-readable cancellation message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Payment was cancelled. You can restart it for your order at any time.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      description: Order ID
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: User missing required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Order not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    OrderStatus:
      type: string
      enum: [PENDING, PAID, SHIPPED, DELIVERED, CANCELLED]

    OrderItem:
      type: object
      required: [productId, name, price, quantity, subtotal]
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
          example: Logitech PRO X2 SUPERSTRIKE
        price:
          type: number
          example: 179.99
        quantity:
          type: integer
          example: 2
        subtotal:
          type: number
          example: 359.98

    Order:
      type: object
      required:
        [
          id,
          userId,
          items,
          total,
          status,
          shippingAddress,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: number
          example: 359.98
        status:
          $ref: '#/components/schemas/OrderStatus'
        shippingAddress:
          type: string
          example: Kirova 1, Minsk
        paymentId:
          type: string
          nullable: true
        captureId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderPayment:
      type: object
      required: [orderId, paymentId, paymentStatus]
      properties:
        orderId:
          type: string
          format: uuid
        paymentId:
          type: string
        paymentStatus:
          type: string
          example: CREATED
        approveUrl:
          type: string
          nullable: true
          format: uri

    CreateOrderRequest:
      type: object
      required: [shippingAddress]
      properties:
        shippingAddress:
          type: string
          minLength: 5
          example: Kirova 1, Minsk

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'

    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: Order not found
        error:
          type: string
          example: Not Found
