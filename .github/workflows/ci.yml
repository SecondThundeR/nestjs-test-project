name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm run test:unit:cov
      - name: Upload coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/unit/
          if-no-files-found: warn
          retention-days: 7

  integration:
    name: Integration tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm run test:integration
      - name: Upload integration failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: test-results/integration/
          retention-days: 7

  e2e:
    name: E2E tests
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: test-results/e2e/
          retention-days: 7

  build:
    name: Docker build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        with:
          # GitHub-hosted runners are discarded after the job.
          cleanup: false
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # PRs validate the build without exporting an image for publication.
          outputs: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && format('type=docker,dest={0}/image.tar', runner.temp) || '' }}
      - name: Upload image for publication
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-artifact@v7
        with:
          name: container-image
          path: ${{ runner.temp }}/image.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  image:
    name: Publish container
    needs: [lint, unit, integration, e2e, build]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download built image
        uses: actions/download-artifact@v8
        with:
          name: container-image
          path: ${{ runner.temp }}
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish built image
        env:
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/image.tar
        run: |
          docker load --input "$IMAGE_ARCHIVE"
          docker push "$IMAGE_NAME:sha-$COMMIT_SHA"
          docker push "$IMAGE_NAME:latest"
