x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped

services:
  gateway:
    <<: *app-base
    command: ['node', 'dist/apps/gateway/main.js']
    environment:
      PRODUCTS_HOST: products
      CART_HOST: cart
      ORDERS_HOST: orders
      USERS_HOST: users
      AUTH_HOST: auth
    ports:
      - '${GATEWAY_PORT:-3000}:${GATEWAY_PORT:-3000}'
    depends_on:
      - products
      - cart
      - orders
      - users
      - auth

  products:
    <<: *app-base
    command: ['node', 'dist/apps/products/main.js']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      PRODUCTS_DB_HOST: products-db
      PRODUCTS_DB_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      products-db:
        condition: service_healthy
      cache:
        condition: service_healthy

  cart:
    <<: *app-base
    command: ['node', 'dist/apps/cart/main.js']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      CART_DB_HOST: cart-db
      CART_DB_PORT: 5432
      PRODUCTS_HOST: products
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    depends_on:
      cart-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  orders:
    <<: *app-base
    command: ['node', 'dist/apps/orders/main.js']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      ORDERS_DB_HOST: orders-db
      ORDERS_DB_PORT: 5432
      PRODUCTS_HOST: products
      CART_HOST: cart
      REDIS_HOST: cache
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    depends_on:
      orders-db:
        condition: service_healthy
      cache:
        condition: service_healthy
      kafka:
        condition: service_healthy

  users:
    <<: *app-base
    command: ['node', 'dist/apps/users/main.js']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      USERS_DB_HOST: users-db
      USERS_DB_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      users-db:
        condition: service_healthy
      cache:
        condition: service_healthy

  auth:
    <<: *app-base
    command: ['node', 'dist/apps/auth/main.js']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      USERS_HOST: users
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      auth-db:
        condition: service_healthy
      users:
        condition: service_started
      cache:
        condition: service_healthy

  products-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${PRODUCTS_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PRODUCTS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${PRODUCTS_DB_NAME:-products}
    ports:
      - '${PRODUCTS_DB_PORT:-5532}:5432'
    volumes:
      - products-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PRODUCTS_DB_USERNAME:-postgres} -d ${PRODUCTS_DB_NAME:-products}']
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - '${KAFKA_HOST_PORT:-9094}:9094'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - '${KAFKA_UI_PORT:-8090}:8080'
    depends_on:
      kafka:
        condition: service_healthy

  cache:
    image: redis:8.8.0-alpine
    command: ['redis-server', '--save', '60', '1']
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - cache-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  cart-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${CART_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CART_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${CART_DB_NAME:-cart}
    ports:
      - '${CART_DB_PORT:-5533}:5432'
    volumes:
      - cart-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${CART_DB_USERNAME:-postgres} -d ${CART_DB_NAME:-cart}']
      interval: 5s
      timeout: 5s
      retries: 5

  orders-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${ORDERS_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${ORDERS_DB_NAME:-orders}
    ports:
      - '${ORDERS_DB_PORT:-5534}:5432'
    volumes:
      - orders-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${ORDERS_DB_USERNAME:-postgres} -d ${ORDERS_DB_NAME:-orders}']
      interval: 5s
      timeout: 5s
      retries: 5

  users-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${USERS_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${USERS_DB_NAME:-users}
    ports:
      - '${USERS_DB_PORT:-5535}:5432'
    volumes:
      - users-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${USERS_DB_USERNAME:-postgres} -d ${USERS_DB_NAME:-users}']
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
    ports:
      - '${AUTH_DB_PORT:-5536}:5432'
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${AUTH_DB_USERNAME:-postgres} -d ${AUTH_DB_NAME:-auth}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  products-db-data:
  kafka-data:
  cache-data:
  cart-db-data:
  orders-db-data:
  users-db-data:
  auth-db-data:
