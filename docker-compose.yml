x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped

services:
  gateway:
    <<: *app-base
    command: ['node', 'dist/apps/gateway/main']
    environment:
      PRODUCTS_HOST: products
      CART_HOST: cart
      ORDERS_HOST: orders
      USERS_HOST: users
      AUTH_HOST: auth
    ports:
      - '${GATEWAY_PORT:-3000}:${GATEWAY_PORT:-3000}'
    depends_on:
      - products
      - cart
      - orders
      - users
      - auth

  products:
    <<: *app-base
    command: ['node', 'dist/apps/products/main']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      PRODUCTS_DB_HOST: products-db
      PRODUCTS_DB_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      products-db:
        condition: service_healthy
      cache:
        condition: service_healthy

  cart:
    <<: *app-base
    command: ['node', 'dist/apps/cart/main']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      CART_DB_HOST: cart-db
      CART_DB_PORT: 5432
    depends_on:
      cart-db:
        condition: service_healthy

  orders:
    <<: *app-base
    command: ['node', 'dist/apps/orders/main']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      ORDERS_DB_HOST: orders-db
      ORDERS_DB_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      orders-db:
        condition: service_healthy
      cache:
        condition: service_healthy

  users:
    <<: *app-base
    command: ['node', 'dist/apps/users/main']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      USERS_DB_HOST: users-db
      USERS_DB_PORT: 5432
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      users-db:
        condition: service_healthy
      cache:
        condition: service_healthy

  auth:
    <<: *app-base
    command: ['node', 'dist/apps/auth/main']
    environment:
      DB_SYNCHRONIZE: 'false'
      DB_MIGRATIONS_RUN: 'true'
      AUTH_DB_HOST: auth-db
      AUTH_DB_PORT: 5432
      USERS_HOST: users
      REDIS_HOST: cache
      REDIS_PORT: 6379
    depends_on:
      auth-db:
        condition: service_healthy
      users:
        condition: service_started
      cache:
        condition: service_healthy

  products-db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${PRODUCTS_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PRODUCTS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${PRODUCTS_DB_NAME:-products}
    ports:
      - '${PRODUCTS_DB_PORT:-5532}:5432'
    volumes:
      - products-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${PRODUCTS_DB_USERNAME:-postgres} -d ${PRODUCTS_DB_NAME:-products}']
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:8.8.0-alpine
    command: ['redis-server', '--save', '60', '1']
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - cache-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  cart-db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${CART_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${CART_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${CART_DB_NAME:-cart}
    ports:
      - '${CART_DB_PORT:-5533}:5432'
    volumes:
      - cart-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${CART_DB_USERNAME:-postgres} -d ${CART_DB_NAME:-cart}']
      interval: 5s
      timeout: 5s
      retries: 5

  orders-db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${ORDERS_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${ORDERS_DB_NAME:-orders}
    ports:
      - '${ORDERS_DB_PORT:-5534}:5432'
    volumes:
      - orders-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${ORDERS_DB_USERNAME:-postgres} -d ${ORDERS_DB_NAME:-orders}']
      interval: 5s
      timeout: 5s
      retries: 5

  users-db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${USERS_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${USERS_DB_NAME:-users}
    ports:
      - '${USERS_DB_PORT:-5535}:5432'
    volumes:
      - users-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${USERS_DB_USERNAME:-postgres} -d ${USERS_DB_NAME:-users}']
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${AUTH_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth}
    ports:
      - '${AUTH_DB_PORT:-5536}:5432'
    volumes:
      - auth-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${AUTH_DB_USERNAME:-postgres} -d ${AUTH_DB_NAME:-auth}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  products-db-data:
  cache-data:
  cart-db-data:
  orders-db-data:
  users-db-data:
  auth-db-data:
